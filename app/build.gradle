plugins {
    alias(libs.plugins.android.application)
    id 'com.google.gms.google-services'


}

android {
    namespace 'com.hridoykrisna.jewellerycalculatoradmin'
    compileSdk 34

    defaultConfig {
        applicationId "com.hridoykrisna.jewellerycalculatoradmin"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildscript {
        dependencies {
            classpath libs.google.services
        }
    }

    packagingOptions {
        // Exclude the META-INF/DEPENDENCIES file to avoid duplicates
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
    }


}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    implementation(libs.firebase.auth)
    implementation(platform(libs.firebase.bom))
    implementation libs.firebase.analytics

    implementation 'com.google.firebase:firebase-database:20.0.5'
    implementation 'com.squareup.okhttp3:okhttp:4.11.0'
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.auth:google-auth-library-oauth2-http:1.15.0'
    implementation 'com.google.code.gson:gson'



    implementation libs.firebase.messaging


//    For Location
    implementation libs.work.runtime
    implementation libs.play.services.location
    implementation platform(libs.firebase.bom.v3101)

}